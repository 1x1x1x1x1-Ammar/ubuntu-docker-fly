plugins {
	id 'fabric-loom' version '1.5-SNAPSHOT'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven { url "https://maven.fabricmc.net/" }
	maven { url "https://maven.terraformersmc.com/" } // ModMenu
}

dependencies {
	// Fabric
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	
	// ModMenu (optional, for mod menu integration)
	// modImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"
	
	// Recommended performance mods (bundled)
	// modImplementation "maven.modrinth:sodium:${project.sodium_version}"
	// modImplementation "maven.modrinth:lithium:${project.lithium_version}"
	// modImplementation "maven.modrinth:ferrite-core:${project.ferrite_version}"
	// modImplementation "maven.modrinth:entityculling:${project.entityculling_version}"
	// modImplementation "maven.modrinth:dynamic-fps:${project.dynamicfps_version}"
}

processResources {
	inputs.property "version", project.version
	
	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.archivesBaseName}" }
	}
}
